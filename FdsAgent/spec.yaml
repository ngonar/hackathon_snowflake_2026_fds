spec:
  containers:
    - name: fds-agent
      image: /snowflake_learning_db/fds/fds_repo/fds-agent:latest
      env:
        SNOWFLAKE_ACCOUNT: "ggzejzx-li33235"
        SNOWFLAKE_HOST: "sm75584.ap-southeast-2.snowflakecomputing.com"
        SNOWFLAKE_USER: "ngartoonist"
        SNOWFLAKE_WAREHOUSE: "SNOWFLAKE_LEARNING_WH"
        SNOWFLAKE_DATABASE: "SNOWFLAKE_LEARNING_DB"
        SNOWFLAKE_SCHEMA: "FDS"
        SNOWFLAKE_ROLE: "ACCOUNTADMIN"
        FDS_DB_PATH: "/app/fds.db"
        SF_POLL_INTERVAL: "5"
        MCP_SERVER_URL: "http://remitapp-mcp-service.gxpx.svc.spcs.internal:8001/mcp"
      readinessProbe:
        port: 8080
        path: /
      resources:
        requests:
          cpu: 0.5
          memory: 1G
        limits:
          cpu: 1
          memory: 2G
  endpoints:
    - name: fds-endpoint
      port: 8080
      public: true
